name: DeployRadar Integration Example

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Trigger DeployRadar Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Deploy via DeployRadar
        uses: ./
        with:
          releaseVersion: '7.23.2'
          componentName: 'aurora-gateway'
          environment: 'Development'
          jobStatus: ${{ job.status }}
          apiKey: ${{ secrets.DEPLOYRADAR_API_KEY }}
