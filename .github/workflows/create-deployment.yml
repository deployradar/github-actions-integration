name: DeployRadar Integration Example

on:
  workflow_dispatch:
    inputs:
      apiUrl:
        description: DeployRadar deployment ingestion endpoint
        required: true
        type: string
        default: https://app-dev.deployradar.com/api/deploy-radar/v1/deploy/github-actions

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Trigger DeployRadar Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Send example payload to DeployRadar
        id: deployradar
        if: ${{ always() }}
        uses: ./
        with:
          releaseVersion: '7.23.2'
          componentName: 'aurora-gateway'
          environment: 'Development'
          jobStatus: ${{ job.status }}
          apiKey: ${{ secrets.DEPLOYRADAR_API_KEY }}
          apiUrl: ${{ inputs.apiUrl }}

      - name: Print deployment result
        run: |
          echo "DeployRadar HTTP status: ${{ steps.deployradar.outputs.status }}"
