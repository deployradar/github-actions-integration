name: DeployRadar Deployment
description: Trigger a DeployRadar deployment via the public API
author: DeployRadar

inputs:
  releaseVersion:
    description: Release version to deploy (semantic version)
    required: true
  componentName:
    description: Component name to deploy
    required: true
  environment:
    description: Target environment (e.g. Production)
    required: true
  deploymentState:
    description: Deployment state (defaults to SUCCESS when previous steps succeed)
    required: false
  apiKey:
    description: DeployRadar API key used for authentication
    required: true

outputs:
  status:
    description: HTTP status returned by the DeployRadar API
  response:
    description: Raw response body from the DeployRadar API when available

runs:
  using: node24
  main: dist/index.js
