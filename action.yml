name: DeployRadar Deployment
description: This action creates a deployment in DeployRadar
author: DeployRadar

inputs:
  releaseVersion:
    description: Release version to deploy (semantic version)
    required: false
  componentName:
    description: Component name to deploy
    required: true
  environment:
    description: Target environment (e.g. Production)
    required: true
  jobStatus:
    description: Current GitHub Actions job status
    required: true
  apiKey:
    description: DeployRadar API key used for authentication
    required: true
  apiUrl:
    description: DeployRadar deployment endpoint URL
    required: false
    default: https://app-dev.deployradar.com/api/deploy-radar/v1/deploy/github-actions

outputs:
  status:
    description: HTTP status returned by the DeployRadar API
  response:
    description: Raw response body from the DeployRadar API when available

runs:
  using: node24
  main: dist/index.js
